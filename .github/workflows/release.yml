name: Release

# On a v* tag (written with the release by Limitry's own
# repository): test and build, then publish to PyPI through trusted
# publishing (no token). Two jobs, so no dependency's code runs where the
# credential exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
      - name: Version from the tag (v1.2.3 or v1.2.3rc1)
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF' is not v<X.Y.Z> or v<X.Y.ZrcN>."; exit 1
          fi
          grep -q "^version = \"$version\"$" pyproject.toml || { echo "::error::pyproject.toml is not $version."; exit 1; }
      - run: uv run --python 3.10 --no-project --with pytest==9.1.1 --with httpx==0.28.1 pytest -q -p no:cacheprovider tests
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
