[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[project]
name = "limitry"
version = "1.0.0rc7"
description = "Limitry API client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://limitry.com/docs/python/"
Source = "https://github.com/limitry/limitry-python"
Changelog = "https://github.com/limitry/limitry-python/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
module-name = "limitry"

[dependency-groups]
test = ["httpx==0.28.1", "pytest==9.1.1"]
